<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Witcher 3 VR launcher icon: a VR headset with two glowing yellow slit-pupil eyes.
       Original artwork for this project; no game assets. Rendered to launcher.ico by
       launcher/icon/make-icon.py. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="0.55" stop-color="#2a2e35"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a909a"/>
      <stop offset="1" stop-color="#3a3e45"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fff6a8"/>
      <stop offset="0.45" stop-color="#ffd21f"/>
      <stop offset="0.85" stop-color="#e88a00"/>
      <stop offset="1" stop-color="#9a4a00"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcc33" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcc33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- strap -->
  <path d="M14 112 Q8 128 14 144 L34 144 L34 112 Z" fill="#23262b"/>
  <path d="M242 112 Q248 128 242 144 L222 144 L222 112 Z" fill="#23262b"/>

  <!-- headset shell with nose cut-out -->
  <path d="M52 64 H204 Q236 64 236 96 V164 Q236 196 204 196 H156
           Q146 196 140 186 Q134 172 128 172 Q122 172 116 186 Q110 196 100 196 H52
           Q20 196 20 164 V96 Q20 64 52 64 Z"
        fill="url(#shell)" stroke="url(#rim)" stroke-width="5"/>

  <!-- lens wells -->
  <ellipse cx="82" cy="126" rx="44" ry="40" fill="#07080a"/>
  <ellipse cx="174" cy="126" rx="44" ry="40" fill="#07080a"/>

  <!-- glow -->
  <ellipse cx="82" cy="126" rx="44" ry="36" fill="url(#glow)"/>
  <ellipse cx="174" cy="126" rx="44" ry="36" fill="url(#glow)"/>

  <!-- eyes: almond shapes with irises and vertical slit pupils -->
  <g>
    <path d="M44 126 Q82 92 120 126 Q82 160 44 126 Z" fill="url(#iris)"/>
    <path d="M82 102 Q90 126 82 150 Q74 126 82 102 Z" fill="#0b0b0b"/>
    <ellipse cx="74" cy="114" rx="5" ry="3.5" fill="#fffbe0" opacity="0.85"/>
  </g>
  <g>
    <path d="M136 126 Q174 92 212 126 Q174 160 136 126 Z" fill="url(#iris)"/>
    <path d="M174 102 Q182 126 174 150 Q166 126 174 102 Z" fill="#0b0b0b"/>
    <ellipse cx="166" cy="114" rx="5" ry="3.5" fill="#fffbe0" opacity="0.85"/>
  </g>

  <!-- top highlight -->
  <path d="M56 72 H200 Q222 72 226 90" fill="none" stroke="#ffffff" stroke-opacity="0.18"
        stroke-width="4" stroke-linecap="round"/>
</svg>
